<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F222D" />
      <stop offset="100%" stop-color="#050C10" />
    </linearGradient>
    <linearGradient id="tf-grad-primary" x1="6" y1="8" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="tf-grad-accent" x1="10" y1="26" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2DD4BF" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="48" height="48" rx="14" fill="url(#bg-grad)" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Subtle glass glossy highlight -->
  <rect x="1" y="1" width="46" height="23" rx="13" fill="white" fill-opacity="0.08" />

  <!-- Layered secondary flow line -->
  <path d="M10 31L19 40L38 21" stroke="url(#tf-grad-accent)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" />

  <!-- Top 'T' Bar -->
  <rect x="8" y="9" width="32" height="9" rx="4.5" fill="url(#tf-grad-primary)" filter="url(#glow)" />

  <!-- Stem of T & F hook -->
  <path d="M23 16V31C23 33.2 21.2 35 19 35C16.8 35 15 33.2 15 31V25" stroke="url(#tf-grad-primary)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dynamic Flowing Checkmark -->
  <path d="M15 27L22 34L39 17" stroke="url(#tf-grad-primary)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Sparkle dot -->
  <circle cx="35" cy="13.5" r="2" fill="#FFFFFF" />
</svg>
